name: ShieldSpec Action Demo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - action.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - fixtures/**
      - .github/workflows/shieldspec-demo.yml

permissions:
  contents: read

jobs:
  action-demo:
    name: Repository fixture demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Confirm shielded proposal passes
        uses: ./
        with:
          candidate: fixtures/shielded-payment.json
          policy: standard
          format: human

      - name: Detect transparent-change regression
        id: regression
        continue-on-error: true
        uses: ./
        with:
          baseline: fixtures/shielded-payment.json
          candidate: fixtures/transparent-change.json
          policy: standard
          format: human

      - name: Confirm the action blocked the regression
        if: always()
        shell: bash
        env:
          REGRESSION_STATUS: ${{ steps.regression.outputs.status }}
        run: |
          if [[ "$REGRESSION_STATUS" != 2 ]]; then
            echo "Expected ShieldSpec status 2, got: $REGRESSION_STATUS" >&2
            exit 1
          fi
