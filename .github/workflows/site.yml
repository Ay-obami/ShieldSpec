name: ShieldSpec product site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Verify and publish static website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Install Node.js for checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check site scripts
        run: node --check site/app.js
      - name: Run website regression checks
        run: node --test site/tests/site.test.mjs
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only public site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
