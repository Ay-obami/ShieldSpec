name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust 1.95.0
        # dtolnay/rust-toolchain 1.95.0
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check canonical fixture copies stay in sync
        run: diff -ru fixtures crates/shieldspec-testkit/fixtures

      - name: Validate historical reproduction harness without network
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Test fail-closed campaign evidence checker
        run: python3 -m unittest discover -s scripts/tests -p 'ci_*test.py' -v

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check Rust runner adapter formatting
        run: cargo fmt --manifest-path examples/runner-adapter/Cargo.toml --check

      - name: Test Rust runner adapter
        run: cargo test --locked --manifest-path examples/runner-adapter/Cargo.toml --all-targets

      - name: Lint Rust runner adapter
        run: cargo clippy --locked --manifest-path examples/runner-adapter/Cargo.toml --all-targets -- -D warnings

      - name: Preflight demo runner protocol
        run: |
          cargo build --locked --manifest-path examples/runner-adapter/Cargo.toml
          cargo run --locked -p shieldspec-fuzz --bin shieldspec-validate-runner -- \
            examples/runner-adapter/target/debug/runner-adapter \
            examples/runner-adapter/fixtures/scenario.json --demo

  mock-wallet:
    name: Independent mock wallet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust 1.95.0
        # dtolnay/rust-toolchain 1.95.0
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path examples/mock-wallet/Cargo.toml --check

      - name: Run tests
        run: cargo test --locked --manifest-path examples/mock-wallet/Cargo.toml --all-targets

      - name: Run Clippy
        run: >-
          cargo clippy --locked
          --manifest-path examples/mock-wallet/Cargo.toml
          --all-targets -- -D warnings

      - name: Assert the example exits with code 2
        shell: bash
        run: |
          set +e
          cargo run --locked --manifest-path examples/mock-wallet/Cargo.toml
          status=$?
          set -e

          if [[ $status -ne 2 ]]; then
            echo "Expected mock-wallet exit code 2, got $status" >&2
            exit 1
          fi

  cli-smoke:
    name: CLI privacy gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust 1.95.0
        # dtolnay/rust-toolchain 1.95.0
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591

      - name: Smoke passing privacy check
        run: >-
          cargo run --locked -p shieldspec-cli -- check
          --input fixtures/shielded-payment.json
          --policy standard
          --format human

      - name: Assert privacy regression exits with code 2
        shell: bash
        run: |
          set +e
          cargo run --locked -p shieldspec-cli -- diff \
            --baseline fixtures/shielded-payment.json \
            --candidate fixtures/transparent-change.json \
            --policy standard \
            --format human
          status=$?
          set -e

          if [[ $status -ne 2 ]]; then
            echo "Expected privacy regression exit code 2, got $status" >&2
            exit 1
          fi

  action-smoke:
    name: Composite action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check a repository fixture with the action
        uses: ./
        with:
          candidate: fixtures/shielded-payment.json
          policy: standard
          format: human

  action-differential:
    name: Differential Action consumer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Built-in Zcash SDK negative control
        id: preset
        uses: ./
        with:
          mode: differential
          preset: zcash-sdk
          seed: '148'
          cases: '2'
          artifact-name: shieldspec-action-sdk-control

      - name: Check the built-in report
        shell: bash
        env:
          CAMPAIGN_STATUS: ${{ steps.preset.outputs.status }}
          CAMPAIGN_REPORT: ${{ steps.preset.outputs.report-path }}
        run: |
          test "$CAMPAIGN_STATUS" = 0
          python3 -m json.tool "$CAMPAIGN_REPORT" > /dev/null

      - name: Controlled custom runner differential
        id: custom
        continue-on-error: true
        uses: ./
        with:
          mode: differential
          preset: custom
          baseline-runner: target/debug/shieldspec-fuzz
          candidate-runner: target/debug/shieldspec-fuzz
          baseline-args: runner
          candidate-args: |
            runner
            --demo-regression
            transparent-change
          cases: '1'
          seed: '148'
          artifact-name: shieldspec-action-custom-difference

      - name: Verify custom evidence and result
        if: always()
        shell: bash
        env:
          CAMPAIGN_STATUS: ${{ steps.custom.outputs.status }}
          CAMPAIGN_REPORT: ${{ steps.custom.outputs.report-path }}
          CAMPAIGN_DISCOVERY: ${{ steps.custom.outputs.discovery-path }}
        run: |
          test "$CAMPAIGN_STATUS" = 2
          python3 -m json.tool "$CAMPAIGN_REPORT" > /dev/null
          python3 -m json.tool "$CAMPAIGN_DISCOVERY" > /dev/null


  real-proposal-runner:
    name: Real Zcash proposal runner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust 1.95.0
        # dtolnay/rust-toolchain 1.95.0
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with:
          components: clippy,rustfmt

      - name: Check runner formatting
        run: cargo fmt --manifest-path crates/shieldspec-zcash-runner/Cargo.toml --check

      - name: Run real proposal tests
        run: cargo test --locked --manifest-path crates/shieldspec-zcash-runner/Cargo.toml --all-targets

      - name: Run runner Clippy
        run: >-
          cargo clippy --locked
          --manifest-path crates/shieldspec-zcash-runner/Cargo.toml
          --all-targets -- -D warnings

  fuzzer-smoke:
    name: Privacy differential fuzzer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust 1.95.0
        # dtolnay/rust-toolchain 1.95.0
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591

      - name: Build real proposal and fuzzer runners
        run: cargo build --locked -p shieldspec-zcash-runner --bins

      - name: Deterministic clean differential smoke
        run: >-
          target/debug/shieldspec-fuzz fuzz
          --baseline-runner target/debug/shieldspec-zcash-runner
          --candidate-runner target/debug/shieldspec-zcash-runner
          --seed 148
          --cases 2
          --format json

      - name: Assert real SDK observed verdicts in four NU6.3 Ironwood cases
        shell: bash
        run: |
          set -euo pipefail
          fuzz=target/debug/shieldspec-fuzz
          runner=target/debug/shieldspec-zcash-runner
          seed=1593835520
          # These digests identify the two tested binaries, not a claimed SDK Git SHA.
          git rev-parse HEAD
          sha256sum "$fuzz" "$runner"
          policy_args=(
            --baseline-runner "$runner"
            --candidate-runner "$runner"
            --baseline-arg=--wallet-spend-policy
            --baseline-arg=orchard-only
            --candidate-arg=--wallet-spend-policy
            --candidate-arg=orchard-only
          )
          # This is an opt-in negative control for the pinned SDK Orchard-only
          # spend-source policy, never the historical Zallet FullPrivacy policy.
          "$fuzz" fuzz --scenario-family ironwood "${policy_args[@]}" \
            --seed "$seed" --cases 4 --format json \
            > "$RUNNER_TEMP/shieldspec-ironwood-campaign.json"
          python3 scripts/tests/ci_campaign_check.py campaign \
            "$RUNNER_TEMP/shieldspec-ironwood-campaign.json" --seed "$seed" --cases 4

          for ordinal in 0 1 2 3; do
            "$fuzz" replay --scenario-family ironwood "${policy_args[@]}" \
              --seed "$seed" --ordinal "$ordinal" --format json \
              > "$RUNNER_TEMP/shieldspec-ironwood-replay-$ordinal.json"
            python3 scripts/tests/ci_campaign_check.py replay \
              "$RUNNER_TEMP/shieldspec-ironwood-replay-$ordinal.json" \
              --seed "$seed" --ordinal "$ordinal"
          done

      - name: Assert judge demo catches the injected regression
        shell: bash
        run: |
          set +e
          target/debug/shieldspec-fuzz demo --format json > /tmp/shieldspec-fuzz-demo.json
          status=$?
          set -e

          cat /tmp/shieldspec-fuzz-demo.json
          if [[ $status -ne 2 ]]; then
            echo "Expected privacy regression exit code 2, got $status" >&2
            exit 1
          fi
          grep -q '"status": "privacy_regression"' /tmp/shieldspec-fuzz-demo.json
          grep -q 'SS003_TRANSPARENT_CHANGE' /tmp/shieldspec-fuzz-demo.json

      - name: Reproduce the exact demo differential
        shell: bash
        run: |
          set +e
          target/debug/shieldspec-fuzz replay \
            --seed 148 \
            --ordinal 0 \
            --policy standard \
            --demo-regression transparent-change \
            --format json > /tmp/shieldspec-fuzz-differential-replay.json
          status=$?
          set -e

          cat /tmp/shieldspec-fuzz-differential-replay.json
          if [[ $status -ne 2 ]]; then
            echo "Expected differential replay exit code 2, got $status" >&2
            exit 1
          fi
          grep -q '"status": "privacy_regression_reproduced"' /tmp/shieldspec-fuzz-differential-replay.json
          grep -q 'SS003_TRANSPARENT_CHANGE' /tmp/shieldspec-fuzz-differential-replay.json

      - name: Replay the committed known-behavior corpus case
        shell: bash
        run: |
          set +e
          target/debug/shieldspec-fuzz replay \
            --input crates/shieldspec-zcash-runner/fixtures/discoveries/tex-transparent-recipient.json \
            --format json > /tmp/shieldspec-fuzz-replay.json
          status=$?
          set -e

          cat /tmp/shieldspec-fuzz-replay.json
          if [[ $status -ne 2 ]]; then
            echo "Expected replayed privacy finding exit code 2, got $status" >&2
            exit 1
          fi
          grep -q '"recorded_rule_reproduced": true' /tmp/shieldspec-fuzz-replay.json
          grep -q 'SS001_TRANSPARENT_RECIPIENT' /tmp/shieldspec-fuzz-replay.json
