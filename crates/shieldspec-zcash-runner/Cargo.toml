[package]
name = "shieldspec-zcash-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
description = "Real-wallet librustzcash proposal harness for ShieldSpec differential fuzzing"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
shieldspec-core = { version = "0.1.0", path = "../shieldspec-core" }
shieldspec-fuzz = { version = "0.1.0", path = "../shieldspec-fuzz" }
shieldspec-zcash = { version = "0.1.0", path = "../shieldspec-zcash" }
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["orchard", "transparent-inputs", "test-dependencies"] }
zcash_client_sqlite = { version = "=0.23.0-pre.2", features = ["orchard", "transparent-inputs", "test-dependencies"] }
zcash_keys = "=0.17.0-pre.2"
zcash_protocol = "=0.11.0-pre.1"
zcash_primitives = "=0.31.0-pre.2"
zcash_transparent = "=0.11.0-pre.2"
zip321 = "=0.10.0-pre.2"

