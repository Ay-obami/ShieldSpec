[package]
name = "shieldspec-zcash"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Adapter from real librustzcash proposals to ShieldSpec privacy snapshots"

[dependencies]
shieldspec-core = { version = "0.2.0", path = "../shieldspec-core" }
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["orchard", "transparent-inputs"] }
zcash_protocol = "=0.11.0-pre.1"

[dev-dependencies]
nonempty = "=0.11.0"
zcash_keys = "=0.17.0-pre.2"
zcash_transparent = "=0.11.0-pre.2"
zip321 = "=0.10.0-pre.2"
