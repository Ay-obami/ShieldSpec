[workspace]
members = [
    "crates/shieldspec-cli",
    "crates/shieldspec-core",
    "crates/shieldspec-fuzz",
    "crates/shieldspec-testkit",
    "crates/shieldspec-zcash",
    "crates/shieldspec-zcash-runner",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Ay-obami/ShieldSpec"
homepage = "https://github.com/Ay-obami/ShieldSpec"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
