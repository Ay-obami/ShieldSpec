[workspace]
members = [
    "crates/shieldspec-cli",
    "crates/shieldspec-core",
    "crates/shieldspec-testkit",
    "crates/shieldspec-zcash",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.81"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
